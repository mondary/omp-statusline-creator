<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OMP Status Line Creator">
  <title>OMP Status Line Creator</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2637"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#tile)" stroke="#334055" stroke-width="1.5"/>
  <!-- segments de la status line -->
  <rect x="5" y="8.5" width="8.5" height="6.5" rx="3.25" fill="#7aa2f7"/>
  <rect x="15" y="8.5" width="6" height="6.5" rx="3.25" fill="#9ece6a"/>
  <rect x="22.5" y="8.5" width="4.5" height="6.5" rx="2.25" fill="#e0af68"/>
  <!-- ligne de base (bordure de l'éditeur) -->
  <rect x="5" y="19.5" width="22" height="3" rx="1.5" fill="#41506b"/>
  <!-- curseur -->
  <rect x="5" y="25.5" width="6" height="2" rx="1" fill="#7aa2f7"/>
</svg>
